{% extends "base.html" %}
{% from "_table.html" import show %}
{% block title %}Search books{% endblock %}
{% block content %}
<section class="card">
  <h1>Search books</h1>
  <form method="get" action="{{ url_for('search') }}" data-validate novalidate>
    <ul class="errors" role="alert">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
    <label>Title keyword
      <input type="text" name="keyword" value="{{ form.keyword }}" placeholder="e.g. murder" data-maxlen="100" data-toolong="Keyword is too long (100 characters at most)">
    </label>
    <div class="row2">
      <label>Minimum price
        <input type="text" name="min_price" inputmode="decimal" value="{{ form.min_price }}" data-number="Minimum price must be a valid number">
      </label>
      <label>Maximum price
        <input type="text" name="max_price" inputmode="decimal" value="{{ form.max_price }}" data-number="Maximum price must be a valid number">
      </label>
    </div>
    <label>Category
      <select name="category_id">
        <option value="">All categories</option>
        {% for c in categories %}
        <option value="{{ c.category_id }}" {% if form.category_id == c.category_id|string %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </label>
    <button class="btn primary">Search</button>
    <a class="btn" href="{{ url_for('search') }}">Clear</a>
  </form>
</section>

<section class="card gap">
  <h1>{{ results.heading }}</h1>
  {{ show(results) }}
</section>
{% endblock %}
